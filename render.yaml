services:
  - type: web
    name: naseb-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: ADMIN_OWNER_IDS
        sync: false
      - key: ADMIN_MANAGER_IDS
        sync: false
      - key: ADMIN_VIEWER_IDS
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEBHOOK_PATH
        value: /telegram
      - key: CHAM_CASH_ACCOUNT
        sync: false
