services:
  - type: web
    name: naseb-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash-lite
      - key: DATABASE_URL
        fromDatabase:
          name: naseb-postgres
          property: connectionString
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEBHOOK_PATH
        value: /telegram
      - key: CHAM_CASH_ACCOUNT
        sync: false

databases:
  - name: naseb-postgres
    plan: free
    region: frankfurt
