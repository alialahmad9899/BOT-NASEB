name: tdd-red

on:
  push:
    branches: [ux-cleanup-whatsapp-flow]

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run UX red test
        run: python -m pytest -q tests/test_client_ux_cleanup.py
